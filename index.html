<script>
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MON=['jan','feb','mar','apr','mei','jun','jul','agu','sep','okt','nov','des'],MN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];

const rp=n=>(n<0?'-':'')+'Rp'+Math.round(Math.abs(n)).toLocaleString('id-ID');
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0),LS=(k,v)=>{try{return v===undefined?localStorage.getItem(k):v===null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
const TY={saving:['Savings','var(--grnS)','+'],invest:['Investment','var(--lavS)','↗'],redeem:['Redemption','var(--skyS)','↙'],spend:['Wedding spend','var(--pinkS)','−']};
const SPC=['Venue','Catering','Decor','Attire','Photo/Video','Invitation','Other'],CATS=['RDPU','RDPT','RDS','RDC','Other'],CL={RDPU:'RDPU · Pasar Uang',RDPT:'RDPT · Pendapatan Tetap',RDS:'RDS · Saham',RDC:'RDC · Campuran',Other:'Lainnya'},PL=['Bibit','Bareksa','Ajaib','Jago','Bank'];
let S={v:'home',fp:'',ft:'',ok:false,st:'',target:50000000,tdate:'2027-10-14',h:[],tx:[]};
/* ---------- PIN ---------- */
const HASH='3e01260a402d0a920f2d76564e2259806f2c762fd035d3323e980e4d71a63806';let pin='',PINV='',UN=false,hid_t=0;
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const dots=()=>$('dots').innerHTML=[0,1,2,3,4,5].map(i=>`<i class="${i<pin.length?'f':''}"></i>`).join('');
$('pad').innerHTML=[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>`<button class="${k===''?'z':k=='⌫'?'dl':''}" onclick="key('${k}')">${k}</button>`).join('');dots();
async function key(k){if(UN||!k&&k!==0)return;if(k=='⌫')pin=pin.slice(0,-1);else if(pin.length<6)pin+=k;dots();if(pin.length<6)return;
let ok=false;try{ok=await sha(pin)==HASH}catch(e){toast('Open this app via its https link')}
if(ok){UN=true;PINV=pin;$('lk').classList.add('go');setTimeout(()=>{if(UN)$('lk').style.display='none'},400);pin='';dots();start()}else{$('dots').classList.add('shk');navigator.vibrate&&navigator.vibrate(120);setTimeout(()=>{$('dots').classList.remove('shk');pin='';dots()},400)}}
addEventListener('keydown',e=>{if(!UN&&/^\d$/.test(e.key))key(e.key);if(!UN&&e.key=='Backspace')key('⌫')});
function lockNow(){UN=false;pin='';dots();$('lk').style.display='grid';requestAnimationFrame(()=>$('lk').classList.remove('go'));closeSh()}

/* ---------- GitHub sync (data.json in a private repo) ---------- */
const cfg=()=>{try{return JSON.parse(LS('wf_cfg'))}catch(e){return null}};let SHA='';
const H=()=>({Authorization:'Bearer '+cfg().token,Accept:'application/vnd.github+json'});
const b64d=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,'')))),b64e=s=>btoa(unescape(encodeURIComponent(s)));
const API=()=>'https://api.github.com/repos/'+cfg().repo;
async function pull(){const r=await fetch(API()+'/contents/data.json?t='+Date.now(),{headers:H(),cache:'no-store'});
if(r.status==404){const q=await fetch(API(),{headers:H()});if(!q.ok)throw new Error('Repo not found, or the token has no access to it');SHA='';return}
if(r.status==401)throw new Error('Token rejected. Check it in Profile');if(!r.ok)throw new Error('GitHub error '+r.status);
const j=await r.json();SHA=j.sha;Object.assign(S,JSON.parse(b64d(j.content)))}
async function push(msg){const r=await fetch(API()+'/contents/data.json',{method:'PUT',headers:H(),body:JSON.stringify({message:msg,content:b64e(JSON.stringify({target:S.target,tdate:S.tdate,h:S.h,tx:S.tx},null,1)),sha:SHA||undefined})});
if(r.status==409||r.status==422)return false;if(!r.ok)throw new Error('Save failed ('+r.status+')');SHA=(await r.json()).content.sha;return true}
async function mutate(fn,msg){try{for(let i=0;i<3;i++){await pull();fn();if(await push(msg)){S.ok=true;S.st='Synced';R();return true}}throw new Error('Sync conflict, please try again')}catch(e){toast(e.message);load();return false}}
async function load(){S.st='Syncing…';R();try{await pull();S.ok=true;S.st='Synced'}catch(e){S.st='Offline: '+e.message}R()}
async function start(){if(!cfg()){S.st='Syncing…';R();await autoCfg()}if(!cfg()){S.v='setup';R()}else{if(S.v=='setup')S.v='home';load()}}
async function connect(){const repo=$('gr').value.trim().replace(/^https?:\/\/github\.com\//,'').replace(/\/$/,''),token=$('gt').value.trim();if(!/^[\w.-]+\/[\w.-]+$/.test(repo)||!token)return toast('Fill repo as owner/name and the token');
LS('wf_cfg',JSON.stringify({repo,token}));try{await pull();S.ok=true;S.st='Synced';S.v='home';R();toast('Connected')}catch(e){LS('wf_cfg',null);toast(e.message)}}
/* shared setup: token encrypted with the PIN, stored as config.json next to index.html */
const B=a=>btoa(String.fromCharCode(...new Uint8Array(a))),U=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function dk(p,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function makeShared(){const c=cfg();if(!c)return toast('Connect this phone first');try{const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await dk(PINV,salt),new TextEncoder().encode(JSON.stringify(c)));
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({v:1,s:B(salt),i:B(iv),c:B(ct)})],{type:'application/json'}));a.download='config.json';a.click();toast('config.json saved. Upload it to the wedding-app repo')}catch(e){toast('Could not create the file')}}
async function autoCfg(){try{const r=await fetch('config.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return false;const j=await r.json(),pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:U(j.i)},await dk(PINV,U(j.s)),U(j.c));LS('wf_cfg',new TextDecoder().decode(pt));return true}catch(e){return false}}
function disconnect(){if(confirm('Disconnect this phone? Your data stays safe in GitHub.')){LS('wf_cfg',null);S.ok=false;S.v='setup';R()}}
/* ---------- calc & views ---------- */
function calc(){const T=S.tx,by=t=>sum(T.filter(x=>x.type==t),x=>x.amt),sv=by('saving'),iv=by('invest'),rd=by('redeem'),sp=by('spend');
let pv=0;S.h.forEach(h=>{pv+=(h.v||0)+sum(T.filter(x=>x.hid==h.id&&x.date>(h.vd||'')),x=>x.type=='invest'?x.amt:x.type=='redeem'?-x.amt:0)});
const cash=sv+rd-sp,cap=iv-rd,fund=cash+pv,per=n=>sum(T.filter(x=>x.person==n&&(x.type=='saving'||x.type=='invest')),x=>x.amt);
const left=Math.max(0,S.target-fund),mo=Math.max(1,Math.ceil((new Date(S.tdate)-new Date(today()))/2629800000));
return{cash,cap,pv,pl:pv-cap,fund,left,pct:Math.min(1,fund/S.target),F:per('Ferry'),D:per('Dini'),pm:left/mo}}
const I=n=>`<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${{home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',tx:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',inv:'<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>',pro:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',plus:'<path d="M12 5v14M5 12h14"/>'}[n]}</svg>`;

function renderForm(){const fx=E.type=='invest'||E.type=='redeem',b=k=>bad.includes(k)?' bad':'';
const ch=(k,a,v,bk)=>`<div class="chips${b(bk||k)}">${a.map(x=>`<button type="button" class="chip${x[0]==v&&v!==''?' on':''}" data-k="${k}" data-v="${esc(x[0])}">${x[1]}</button>`).join('')}</div>`;
const pls=[...new Set([...PL,'Other',E.plat].filter(Boolean))];
$('fm').innerHTML=`<div class="fl">What is it?</div>${ch('type',Object.keys(TY).map(k=>[k,TY[k][2]+' '+TY[k][0]]),E.type)}
${fx?`<div class="fl">Which fund?</div>${ch('hid',[...S.h.map(h=>[h.id,esc(h.name)+'<small>'+esc(h.plat)+' · '+esc(CL[h.cat]||h.cat)+'</small>']),...(E.type=='invest'?[['new','＋ New fund']]:[])],E.hid,'fund')}
${E.type=='redeem'&&!S.h.length?'<p class="mu">No funds yet, so there is nothing to redeem.</p>':''}
${E.hid=='new'?`<div class="fg"><label class="w">Fund name<input class="${b('fund').trim()}" value="${esc(E.fund)}" oninput="E.fund=this.value" placeholder="e.g. Sucorinvest Money Market"></label></div>
<div class="fl">Platform</div>${ch('plat',pls.map(p=>[p,p]),E.plat)}<div class="fl">Fund type</div>${ch('cat',CATS.map(c=>[c,CL[c]]),E.cat)}`:''}`:''}
${E.type=='spend'?`<div class="fl">Spent on</div>${ch('sc',SPC.map(c=>[c,c]),E.sc)}`:''}
<div class="fl">Who</div>${ch('person',[['Ferry','Ferry'],['Dini','Dini']],E.person)}
<div class="fl">Amount</div><input id="am" inputmode="numeric" class="${b('amt').trim()}" placeholder="Rp 0" value="${E.amt?E.amt.toLocaleString('id-ID'):''}" oninput="amt(this)">
<div class="chips q" style="margin-top:8px">${[[1e5,'100rb'],[5e5,'500rb'],[1e6,'1jt'],[5e6,'5jt']].map(x=>`<button type="button" class="chip" onclick="addA(${x[0]})">+${x[1]}</button>`).join('')}<button type="button" class="chip" onclick="E.amt=0;$('am').value=''">Clear</button></div>
<div class="fg"><label>Date<input type="date" class="${b('date').trim()}" value="${E.date}" oninput="E.date=this.value"></label><label>Notes (optional)<input value="${esc(E.note)}" oninput="E.note=this.value" placeholder="e.g. DP katering"></label></div>`}
function amt(el){E.amt=+el.value.replace(/\D/g,'')||0;el.value=E.amt?E.amt.toLocaleString('id-ID'):''}
function addA(n){E.amt+=n;$('am').value=E.amt.toLocaleString('id-ID')}
function openSh(){E=blank();bad=[];$('sm').value='';$('msg').style.display='none';renderForm();$('ov').classList.add('on')}
function closeSh(){$('ov').classList.remove('on')}
function readIt(){const t=$('sm').value.trim();if(!t)return;E=parse(t);bad=miss();renderForm();const m=$('msg');m.style.display='block';
m.textContent=bad.length?'I couldn’t find: '+bad.map(k=>LBL[k]).join(', ')+'. Please fill it in below. Nothing is saved yet.':'Check the details below. Nothing is saved until you confirm.'}
async function save(){if(busy)return;bad=miss();if(bad.length){renderForm();const m=$('msg');m.style.display='block';m.textContent='Please complete: '+bad.map(k=>LBL[k]).join(', ')+'.';return}
busy=true;$('cf').disabled=true;$('cf').textContent='Saving…';LS('wf_me',E.person);const e={...E};
const ok=await mutate(()=>{let hid=0;if(e.type=='invest'||e.type=='redeem'){if(e.hid=='new'){const n=e.fund.trim(),p=e.plat.trim()||'—';let h=S.h.find(h=>h.name.toLowerCase()==n.toLowerCase()&&h.plat.toLowerCase()==p.toLowerCase());
if(!h){h={id:Date.now(),name:n,plat:p,cat:e.cat||'Other',v:0,vd:''};S.h.push(h)}hid=h.id}else hid=+e.hid}
S.tx.push({id:Date.now(),date:e.date,person:e.person,type:e.type,amt:e.amt,hid,cat:e.type=='spend'?e.sc:'',note:e.note.trim()})},'Add '+e.type+' '+e.amt);
busy=false;$('cf').disabled=false;$('cf').textContent='Confirm transaction';if(ok){closeSh();toast('Transaction saved')}}
R();
</script></body></html>
